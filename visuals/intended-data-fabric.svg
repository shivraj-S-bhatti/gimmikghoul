<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-label="The intended reasoning fabric"><rect width="100%" height="100%" fill="#101922"/><text x="52" y="48" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">GIMMIKGHOUL / DATA VISION</text><text x="52" y="104" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="600">The intended reasoning fabric</text><text x="52" y="142" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Stable mechanics, changing experience and creative theories meet in a selected decision.</text><rect x="44" y="185" width="412" height="665" rx="18" fill="#192630" stroke="#334650"/><text x="68" y="225" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">MECHANICS</text><text x="68" y="264" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400">What can happen</text><rect x="514" y="185" width="412" height="665" rx="18" fill="#192630" stroke="#334650"/><text x="538" y="225" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">THEORIES</text><text x="538" y="264" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400">What might work</text><rect x="984" y="185" width="412" height="665" rx="18" fill="#192630" stroke="#334650"/><text x="1008" y="225" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">CONTEXT THROUGH TIME</text><text x="1008" y="264" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400">What has been seen</text><path d="M430,422 C490.0,422 490.0,422 550,422" fill="none" stroke="#8fbbea" stroke-width="2.5" /><path d="M1010,422 C954.0,422 954.0,422 898,422" fill="none" stroke="#75d8c0" stroke-width="2.5" /><path d="M720,850 C720.0,850 720.0,906 720,906" fill="none" stroke="#ebc66f" stroke-width="2.5" /><rect x="70" y="303" width="355" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="83" y="328" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Species / form</text><text x="86" y="369" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Move / ability / item</text><rect x="70" y="411" width="355" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="83" y="436" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Executable effects</text><text x="86" y="477" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Targets · timing · field</text><rect x="70" y="519" width="355" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="83" y="544" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Ruleset + version</text><text x="86" y="585" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Availability · restrictions</text><rect x="70" y="627" width="355" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="83" y="652" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Exact candidate sets</text><text x="86" y="693" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Moves · investment · item</text><text x="70" y="771" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Source code and rules anchor the model.</text><text x="70" y="794" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">A static edge is not a complete interaction.</text><rect x="540" y="303" width="355" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="553" y="328" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Goal / role</text><text x="556" y="369" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Player preference · selected opponents</text><rect x="540" y="411" width="355" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="553" y="436" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Conditional route</text><text x="556" y="477" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Joint prerequisites → intended effect</text><rect x="540" y="519" width="355" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="553" y="544" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Alternatives / counterplay</text><text x="556" y="585" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Costs · concessions · fallback modes</text><rect x="540" y="627" width="355" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="553" y="652" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Theory revision + checks</text><text x="556" y="693" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Proposed · checked · rejected · open</text><text x="540" y="771" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">A route node can encode a hyperedge.</text><text x="540" y="794" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">The evaluator must enforce its conditions.</text><rect x="1010" y="303" width="355" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1023" y="328" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Report / video / observation</text><text x="1026" y="369" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Author · locator · observed date</text><rect x="1010" y="411" width="355" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1023" y="436" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Meta snapshot</text><text x="1026" y="477" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Format · period · population · usage</text><rect x="1010" y="519" width="355" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1023" y="544" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Claim + validity interval</text><text x="1026" y="585" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Who says it? When does it apply?</text><rect x="1010" y="627" width="355" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1023" y="652" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Competing interpretations</text><text x="1026" y="693" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Mechanism hypothesis · missing evidence</text><text x="1010" y="771" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Correlation suggests directions to explore.</text><text x="1010" y="794" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">It does not supply a causal guarantee.</text><rect x="44" y="904" width="1352" height="150" rx="18" fill="#20343b" stroke="#75d8c0"/><text x="72" y="943" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">TASK-SPECIFIC PROJECTION</text><text x="72" y="980" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">One player question → a small human map + an agent’s working representation</text><text x="72" y="1018" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">Query a path · expand a joint condition · choose a check · revise a theory · recover a past interpretation</text><text x="52" y="1091" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Intended model · layers can share a store; separate graphs are optional. The current implementation covers a smaller subset.</text></svg>