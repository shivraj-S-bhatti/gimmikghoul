<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="Follow the conditions, find another route"><rect width="100%" height="100%" fill="#101922"/><text x="52" y="48" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">GIMMIKGHOUL / STORYBOARD 02</text><text x="52" y="104" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="600">Follow the conditions, find another route</text><text x="52" y="142" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">VGC doubles · explore Torterra, Mega Raichu Y and Milotic as an open team-building question.</text><rect x="44" y="180" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="69" y="220" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">01</text><text x="111" y="220" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Name the intended turn</text><text x="69" y="255" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">“Can Torterra get a useful setup opportunity?”</text><circle cx="176" cy="353" r="42" fill="#233540" stroke="#50616b"/><image x="125" y="302" width="102" height="102" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="128" y="418" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Torterra</text><circle cx="367" cy="353" r="42" fill="#233540" stroke="#50616b"/><image x="316" y="302" width="102" height="102" href="data:image/gif;base64," style="image-rendering:pixelated"/><text x="319" y="418" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Mega Raichu Y</text><circle cx="558" cy="353" r="42" fill="#233540" stroke="#50616b"/><image x="507" y="302" width="102" height="102" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="510" y="418" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Milotic</text><text x="75" y="455" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">The trio is a starting hypothesis.</text><text x="75" y="480" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Choose the ruleset and inspect each proposed interaction.</text><rect x="746" y="180" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="771" y="220" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">02</text><text x="813" y="220" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Search across mechanisms</text><text x="771" y="255" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Generate several ways to create the same opportunity.</text><rect x="782" y="302" width="175" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="795" y="327" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Redirection</text><rect x="1000" y="302" width="175" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="1013" y="327" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Turn order</text><rect x="782" y="370" width="200" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="795" y="395" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Damage mitigation</text><rect x="1020" y="370" width="200" height="38" rx="19" fill="#15242c" stroke="#ef998d"/><text x="1033" y="395" fill="#ef998d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Force a choice</text><text x="777" y="455" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Candidates differ in targeting, timing and cost.</text><text x="777" y="480" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">The graph carries conditions, not a universal “protects” edge.</text><rect x="44" y="563" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="69" y="603" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">03</text><text x="111" y="603" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">A route needs all its premises</text><text x="69" y="638" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">One route node represents a joint requirement.</text><rect x="78" y="673" width="190" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="91" y="698" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Targetable move</text><rect x="78" y="727" width="225" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="91" y="752" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Support acts in time</text><rect x="78" y="781" width="190" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="91" y="806" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Setup survives</text><path d="M303,746 C344.0,746 344.0,742 385,742" fill="none" stroke="#75d8c0" stroke-width="2.5" /><path d="M268,692 C326.5,692 326.5,742 385,742" fill="none" stroke="#75d8c0" stroke-width="2.5" /><path d="M268,800 C326.5,800 326.5,742 385,742" fill="none" stroke="#75d8c0" stroke-width="2.5" /><rect x="385" y="723" width="260" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="398" y="748" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">AND → setup route</text><text x="75" y="862" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Missing one premise keeps the route unresolved.</text><rect x="746" y="563" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="771" y="603" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">04</text><text x="813" y="603" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Choose an informative test</text><text x="771" y="638" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Challenge the premise that could change the team.</text><rect x="782" y="685" width="230" height="38" rx="19" fill="#15242c" stroke="#ef998d"/><text x="795" y="710" fill="#ef998d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Opponent response</text><path d="M1012,704 C1046.0,704 1046.0,755 1080,755" fill="none" stroke="#ef998d" stroke-width="2.5" /><rect x="1055" y="736" width="230" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1068" y="761" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Selected trace</text><rect x="782" y="765" width="220" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="795" y="790" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Fallback line</text><path d="M1002,784 C1028.5,784 1028.5,755 1055,755" fill="none" stroke="#8fbbea" stroke-width="2.5" /><text x="777" y="844" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Keep the useful idea even if its first execution fails.</text><text x="52" y="986" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500">Agents may reason over temporary hypergraphs; the player sees a small map of meaningful choices.</text><text x="52" y="1024" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Design storyboard · no legality, viability or successful opening is asserted for this candidate trio.</text></svg>