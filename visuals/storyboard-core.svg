<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="An overlooked core gets a job"><rect width="100%" height="100%" fill="#101922"/><text x="52" y="48" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">GIMMIKGHOUL / STORYBOARD 01</text><text x="52" y="104" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="600">An overlooked core gets a job</text><text x="52" y="142" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400">BSS singles · a player and agent explore possibilities, then choose what matters.</text><rect x="44" y="180" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="69" y="220" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">01</text><text x="111" y="220" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Start with a question</text><text x="69" y="255" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">“What would make Mega Sableye worth bringing?”</text><path d="M181,349 C322.5,349 322.5,349 464,349" fill="none" stroke="#75d8c0" stroke-width="2.5" /><circle cx="181" cy="349" r="42" fill="#233540" stroke="#50616b"/><image x="130" y="298" width="102" height="102" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="133" y="414" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Mega Sableye</text><rect x="400" y="330" width="180" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="413" y="355" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">A useful role</text><text x="75" y="455" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Player pins a core, a format and a preference.</text><text x="75" y="480" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">The agent asks which opposing plans matter.</text><rect x="746" y="180" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="771" y="220" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">02</text><text x="813" y="220" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Expand mechanisms</text><text x="771" y="255" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">Explore routes to the job, rather than one synergy score.</text><path d="M856,353 C973.5,353 973.5,311 1091,311" fill="none" stroke="#75d8c0" stroke-width="2.5" /><path d="M856,353 C973.5,353 973.5,389 1091,389" fill="none" stroke="#8fbbea" stroke-width="2.5" /><circle cx="856" cy="353" r="42" fill="#233540" stroke="#50616b"/><image x="805" y="302" width="102" height="102" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="808" y="418" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Galarian Slowking</text><rect x="1051" y="289" width="230" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1064" y="314" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Handle chosen Fairy?</text><rect x="1051" y="369" width="230" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="1064" y="394" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Preserve momentum?</text><text x="777" y="455" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">A resistance suggests a candidate, not a verdict.</text><text x="777" y="480" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Inspect exact sets, recovery and switching costs.</text><rect x="44" y="563" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="69" y="603" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">03</text><text x="111" y="603" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Expose the fragile premise</text><text x="69" y="638" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">“What if their Fairy carries a coverage move?”</text><rect x="78" y="703" width="185" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="91" y="728" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Switch-in route</text><path d="M263,723 C301.5,723 301.5,723 340,723" fill="none" stroke="#ef998d" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="340" y="703" width="240" height="38" rx="19" fill="#15242c" stroke="#ef998d"/><text x="353" y="728" fill="#ef998d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Coverage / chip?</text><rect x="120" y="773" width="210" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="133" y="798" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Alternative partner</text><rect x="380" y="773" width="220" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="393" y="798" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Concede matchup</text><text x="75" y="844" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Expand counterplay. Keep another route on the board.</text><rect x="746" y="563" width="650" height="355" rx="18" fill="#192630" stroke="#334650"/><text x="771" y="603" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">04</text><text x="813" y="603" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Check one decision; revise</text><text x="771" y="638" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400">A selected calculation or trace informs the next choice.</text><rect x="780" y="702" width="210" height="38" rx="19" fill="#15242c" stroke="#8fbbea"/><text x="793" y="727" fill="#8fbbea" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Exact sets + field</text><path d="M990,721 C1019.0,721 1019.0,721 1048,721" fill="none" stroke="#75d8c0" stroke-width="2.5" /><rect x="1048" y="702" width="215" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="1061" y="727" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Native checker</text><rect x="780" y="767" width="110" height="38" rx="19" fill="#15242c" stroke="#75d8c0"/><text x="793" y="792" fill="#75d8c0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Keep</text><rect x="906" y="767" width="120" height="38" rx="19" fill="#15242c" stroke="#ebc66f"/><text x="919" y="792" fill="#ebc66f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Revise</text><rect x="1042" y="767" width="220" height="38" rx="19" fill="#15242c" stroke="#ef998d"/><text x="1055" y="792" fill="#ef998d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Still unknown</text><text x="777" y="844" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400">Retain the idea, its concessions and the reason for change.</text><text x="52" y="986" fill="#edf1e9" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500">A symbolic map for discussion. Expand details only when they can change a decision.</text><text x="52" y="1024" fill="#a7b8bb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400">Design storyboard · these prompts are proposed interactions, not measured matchup findings.</text></svg>